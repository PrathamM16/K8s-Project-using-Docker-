apiVersion: apps/v1
kind: Deployment
metadata: { name: rabbitmq, namespace: demo }
spec:
  replicas: 1
  selector: { matchLabels: { app: rabbitmq } }
  template:
    metadata: { labels: { app: rabbitmq } }
    spec:
      containers:
      - name: rabbitmq
        image: rabbitmq:3-management-alpine
        ports: [{ containerPort: 5672 }, { containerPort: 15672 }]
        readinessProbe:
          tcpSocket: { port: 5672 }
          initialDelaySeconds: 10
---
apiVersion: v1
kind: Service
metadata: { name: rabbitmq, namespace: demo }
spec:
  selector: { app: rabbitmq }
  ports:
  - { name: amqp, port: 5672 }
  - { name: ui, port: 15672 }
---
apiVersion: v1
kind: Service
metadata: { name: rabbitmq-ui, namespace: demo }
spec:
  type: NodePort
  selector: { app: rabbitmq }
  ports: [{ port: 15672, targetPort: 15672, nodePort: 30672 }]
