apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: postgres-pvc, namespace: demo }
spec:
  accessModes: [ReadWriteOnce]
  resources: { requests: { storage: 1Gi } }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: postgres, namespace: demo }
spec:
  replicas: 1
  selector: { matchLabels: { app: postgres } }
  template:
    metadata: { labels: { app: postgres } }
    spec:
      containers:
      - name: postgres
        image: postgres:16-alpine
        ports: [{ containerPort: 5432 }]
        env:
        - { name: POSTGRES_USER, valueFrom: { secretKeyRef: { name: app-secrets, key: DB_USER } } }
        - { name: POSTGRES_PASSWORD, valueFrom: { secretKeyRef: { name: app-secrets, key: DB_PASSWORD } } }
        - { name: POSTGRES_DB, valueFrom: { secretKeyRef: { name: app-secrets, key: DB_NAME } } }
        - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
        volumeMounts: [{ name: data, mountPath: /var/lib/postgresql/data }]
        readinessProbe:
          exec: { command: ["pg_isready", "-U", "demo"] }
          initialDelaySeconds: 5
      volumes:
      - name: data
        persistentVolumeClaim: { claimName: postgres-pvc }
---
apiVersion: v1
kind: Service
metadata: { name: postgres, namespace: demo }
spec:
  selector: { app: postgres }
  ports: [{ port: 5432 }]
