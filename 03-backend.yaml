apiVersion: apps/v1
kind: Deployment
metadata: { name: backend, namespace: demo }
spec:
  replicas: 2
  selector: { matchLabels: { app: backend } }
  template:
    metadata: { labels: { app: backend } }
    spec:
      containers:
      - name: backend
        image: demo/backend:1.0
        imagePullPolicy: IfNotPresent
        ports: [{ containerPort: 3000 }]
        env:
        - { name: DB_HOST, value: postgres }
        - { name: DB_USER, valueFrom: { secretKeyRef: { name: app-secrets, key: DB_USER } } }
        - { name: DB_PASSWORD, valueFrom: { secretKeyRef: { name: app-secrets, key: DB_PASSWORD } } }
        - { name: DB_NAME, valueFrom: { secretKeyRef: { name: app-secrets, key: DB_NAME } } }
        - { name: RABBIT_URL, valueFrom: { secretKeyRef: { name: app-secrets, key: RABBIT_URL } } }
        readinessProbe:
          httpGet: { path: /api/health, port: 3000 }
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata: { name: backend, namespace: demo }
spec:
  selector: { app: backend }
  ports: [{ port: 3000 }]
